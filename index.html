// ---- engine.js ----
/* Pure scheduling engine. All times are minutes since the start of the shift.
   Intervals are half-open [start,end): finishing at a break start is allowed. */
(function (root) {
  'use strict';
  const MODES = new Map();
  const OBJECTIVES = {
    'makespan': { label: 'Fin de producción', symbol: 'Cmax', unit: 'min', key: 'cmax' },
    'total-completion-time': { label: 'Tiempo acumulado', symbol: 'ΣCj', unit: 'min', key: 'totalCompletion' },
    'weighted-completion': { label: 'Tiempo por prioridad', symbol: 'ΣwjCj', unit: 'min·peso', key: 'weightedCompletion' },
    'total-tardiness': { label: 'Retraso total', symbol: 'ΣTj', unit: 'min', key: 'totalTardiness' },
    'weighted-tardiness': { label: 'Retraso por prioridad', symbol: 'ΣwjTj', unit: 'min·peso', key: 'weightedTardiness' },
    'late-jobs': { label: 'Pedidos tardíos', symbol: 'ΣUj', unit: 'pedidos', key: 'lateCount' },
    'load-balance': { label: 'Diferencia de carga', symbol: 'Δ carga', unit: 'min', key: 'imbalance' }
  };
  function validateLevel(level) {
    if (!Number.isInteger(level.machines) || level.machines < 1) throw new Error('Número de máquinas inválido.');
    if (!OBJECTIVES[level.objective]) throw new Error('Objetivo desconocido.');
    if (!Array.isArray(level.jobs) || !level.jobs.length) throw new Error('Faltan pedidos.');
    const ids = new Set();
    for (const j of level.jobs) {
      if (ids.has(j.id)) throw new Error('Pedido duplicado.');
      ids.add(j.id);
      if (![j.p,j.r,j.d].every(Number.isInteger) || !Number.isFinite(j.w) || j.p <= 0 || j.r < 0 || j.d < 0 || j.w <= 0) throw new Error('Usa minutos enteros y prioridades positivas.');
    }
    for (const b of level.breaks || []) {
      if (!Number.isInteger(b.start) || !Number.isInteger(b.end) || b.start < 0 || b.end <= b.start || (b.machine != null && (!Number.isInteger(b.machine) || b.machine < 0 || b.machine >= level.machines))) throw new Error('Descanso inválido.');
    }
    return true;
  }
  function nextSlot(earliest, duration, breaks) {
    let start = earliest;
    for (const b of [...breaks].sort((a,b) => a.start - b.start)) {
      if (start < b.end && start + duration > b.start) start = b.end;
    }
    return start;
  }
  function blockedDuration(breaks, end) {
    let total = 0, last = 0;
    for (const b of [...breaks].sort((a,b) => a.start-b.start)) {
      const a = Math.max(last,b.start), z = Math.min(end,b.end);
      if (z > a) total += z-a;
      last = Math.max(last,z);
    }

  }

    const cmax = Math.max(0,...operations.map(o=>o.end));
    const loads = Array.from({length:level.machines},(_,m)=>operations.filter(o=>o.machine===m).reduce((s,o)=>s+o.p,0));
    const totals = operations.reduce((s,o)=>{
      s.totalCompletion+=o.C; s.totalFlow+=o.F; s.totalLateness+=o.L;
      s.totalTardiness+=o.T; s.weightedCompletion+=o.w*o.C; s.weightedTardiness+=o.w*o.T;
      s.lateCount+=Number(o.T>0); return s;
    },{totalCompletion:0,totalFlow:0,totalLateness:0,totalTardiness:0,weightedCompletion:0,weightedTardiness:0,lateCount:0});
    const available = Array.from({length:level.machines},(_,m)=>cmax-blockedDuration((level.breaks||[]).filter(b=>b.machine==null||b.machine===m),cmax)).reduce((a,b)=>a+b,0);
    const processing = loads.reduce((a,b)=>a+b,0);
    return {...totals,cmax,loads,completed:operations.length,onTime:operations.length-totals.lateCount,imbalance:Math.max(...loads)-Math.min(...loads),idle:Math.max(0,available-processing),utilization:available?processing/available:0};
  }
  function queueSchedule(level, queues) {
    const jobs = new Map(level.jobs.map(j=>[j.id,j]));
    const operations = [];
    queues.forEach((queue,machine)=>{
      let free = 0;
      const breaks = (level.breaks||[]).filter(b=>b.machine==null||b.machine===machine);
      queue.forEach(id=>{
        const j = jobs.get(id);

  MODES.set('parallel-identical',queueSchedule);

(function(root){
  'use strict';
  function evaluateScore(level,schedule,benchmark,hints=0,revealed=false){
    if(!schedule.complete)throw new Error('Completa todos los pedidos antes de evaluar.');
    const playerScore=schedule.objective, optimalScore=benchmark.value;
    // Additive normalization works for optima of zero (tardiness, imbalance, late count).
    const scale=level.objective==='late-jobs'?level.jobs.length:level.jobs.reduce((s,j)=>s+j.p*(level.objective.startsWith('weighted')?j.w:1),0);
    const efficiency=Math.max(0,Math.min(1,1-(playerScore-optimalScore)/Math.max(1,scale)));
    const optimal=Math.abs(playerScore-optimalScore)<1e-8;
    const stars=efficiency>=.98?3:efficiency>=.80?2:1;
    // Intro missions have no deadline decision, so their delivery bonus is fixed.
    const deliveryFraction=level.show?.includes('d')?schedule.metrics.onTime/level.jobs.length:1;
    const breakdown={completion:1000,efficiency:Math.round(efficiency*5000),onTime:Math.round(deliveryFraction*1000),independent:hints===0?500:0,optimal:optimal?1000:0,hints:-hints*100};
    const points=Math.max(1000,Object.values(breakdown).reduce((a,b)=>a+b,0));
    return {playerScore,optimalScore,efficiency,scale,optimal,stars,points,breakdown,practice:revealed};
  }
  const api={evaluateScore};root.DairyScoring=api;if(typeof module!=='undefined')module.exports=api;
})(globalThis);

(function(root){

      clean.lastLevel=Number.isInteger(value.lastLevel)&&value.lastLevel>=1&&value.lastLevel<=maxLevel()?value.lastLevel:1;

      return clean;

    if(result.practice)return data;

ición y ejemplo <b>↗</b></span></button>`).join('')}</div></section>${category==='strategies'?`<section class="minilab"><div><p class="eyebrow">PRUEBA SIN PUNTOS NI PENALIZACIONES</p><h2>Dos clientes. ¿Quién va primero?</h2><p>El queso tarda 30 minutos; la leche, 10. Los dos están disponibles a las 08:00.</p><button class="primary" data-action="lab-toggle">⇄ Cambiar el orden</button></div><div class="lab-visual" aria-live="polite"><div class="lab-products">${lab?Art().product('Leche fresca')+Art().product('Queso fresco'):Art().product('Queso fresco')+Art().product('Leche fresca')}</div><div class="lab-bars ${lab?'short-first':''}"><span>${lab?'Leche · 10 min':'Queso · 30 min'}</span><span>${lab?'Queso · 30 min':'Leche · 10 min'}</span></div><b>Finalizaciones: ${lab?'10 + 40 = 50':'30 + 40 = 70'} min</b><p>Ambos órdenes acaban a las 08:40. Cambia cuánto esperan los clientes en conjunto.</p></div></section>`:''}<div class="note-box"><b>Tu progreso y tus puntos</b><p>Una estrella basta para avanzar. Las pistas restan 100 puntos cada una y la primera elimina el bono de 500 por jugar sin pistas; nunca reducen estrellas. Consultar la Academia no penaliza. Ver una solución abre un intento de práctica.</p><details><summary>Cómo medimos la calidad</summary><p>Calidad = max(0, 1 − (tu objetivo − óptimo) / escala) × 100. Escala: Σpj, o Σwjpj para objetivos ponderados, o n para contar tardíos. No es utilización de máquinas. Tres estrellas requieren 98%; dos, 80%.</p><p>Puntos: 1.000 por completar, hasta 5.000 por calidad, hasta 1.000 por puntualidad, 500 sin pistas y 1.000 por óptimo; cada pista resta 100. Las misiones sin fechas tienen 1.000 de iniciación fijos. Máximo: 8.500.</p></details></div>`;

(function(root){
  const achievements=[
    {id:'first',name:'Primer turno',description:'Completa tu primera misión.',earned:d=>Object.keys(d.results).length>0},
    {id:'timely',name:'Justo a tiempo',description:'Completa una misión de entregas sin pedidos tardíos.',earned:d=>Object.values(d.results).some(r=>r.onTime===true)},
    {id:'perfect',name:'Producción perfecta',description:'Obtén tres estrellas.',earned:d=>Object.values(d.results).some(r=>r.stars===3)},
    {id:'independent',name:'Sin ayuda',description:'Obtén tres estrellas sin utilizar pistas.',earned:d=>Object.values(d.results).some(r=>r.noHintsThree===true)},
    {id:'student',name:'Estudiante aplicado',description:'Consulta cinco conceptos de la Academia.',earned:d=>new Set((d.conceptsRead||[]).filter(id=>root.DairyAcademy.entries.some(e=>e.id===id))).size>=5},
    {id:'master',name:'Maestro de la Secuenciación',description:'Completa el examen del jefe de planta.',earned:d=>!!d.results[13]}
  ];
  function visit(data,id){if(!root.DairyAcademy.entries.some(e=>e.id===id))return false;data.conceptsRead=[...new Set([...(data.conceptsRead||[]),id])];root.DairyStorage.save(data);return true;}
  function discover(data,level){data.seenLevels=[...new Set([...(data.seenLevels||[]),level])];root.DairyStorage.save(data);}
  function isDiscovered(data,entry){return (data.seenLevels||[]).includes(entry.unlockedAt)||!!data.results[entry.unlockedAt];}
  root.DairyProgress={achievements,visit,discover,isDiscovered};
})(globalThis);

  function worldArt(id){return id===1?Art.product('Leche fresca'):id===2?Art.machine():id===3?Art.truck():Art.medal();}
  function worldCard(w){const done=w.ids.filter(id=>state.data.results[id]).length,unlocked=S.isUnlocked(state.data,w.ids[0]);return `<button class="world-card ${w.color} ${unlocked?'':'locked'}" data-world="${w.id}" aria-label="Ver mundo ${w.id}: ${w.name}"><div class="world-card-top"><span class="world-icon">${worldArt(w.id)}</span><span class="world-status">${done===w.ids.length?'✓ COMPLETADO':unlocked?'DISPONIBLE':'▣ BLOQUEADO'}</span></div><span class="eyebrow">MUNDO 0${w.id} · ${w.place.toUpperCase()}</span><h3>${w.name}</h3><p>${w.description}</p><div class="world-card-bottom"><span>${done} / ${w.ids.length} misiones</span><span>${unlocked?'→':'Completa el mundo anterior'}</span></div><div class="world-dots">${w.ids.map(id=>`<i class="${state.data.results[id]?'filled':''}"></i>`).join('')}</div></button>`;}
  const time=(minutes)=>{const t=480+Math.floor(minutes);return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;};
  const machineName=m=>'Pasteurizador '+String.fromCharCode(65+m);
  const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  let toastTimer,dragged=null,previousFocus=null,guideTimer;
  function resetIdle(){state.idleSeconds=0;state.stuck=false;const panel=document.getElementById('stuck-help');if(panel)panel.hidden=true;}
  setInterval(()=>{if(state.view!=='game'||state.running||state.guide||document.hidden||document.getElementById('modal').open)return;if(++state.idleSeconds>=45&&!state.stuck){state.stuck=true;const panel=document.getElementById('stuck-help');if(panel)panel.hidden=false;document.getElementById('announcer').textContent='Si te atascaste, puedes pedir una pista o ver una explicación paso a paso. No hay límite de tiempo.';}},1000);
  function learningPanel(schedule){
    const g=state.guide;
    if(g){
      const o=g.operations[g.index-1];let explanation='Vamos a recorrer un plan completo óptimo. Sus decisiones funcionan en conjunto; puede haber otros planes igual de buenos. Avanza a tu ritmo o reproduce la explicación. Tu plan original está guardado.';
      if(o){const prev=g.operations.filter(x=>x.machine===o.machine&&x.end<=o.start&&x.id!==o.id).sort((a,b)=>b.end-a.end)[0],free=prev?.end||0,ready=Math.max(free,o.r);explanation=`Colocamos ${o.id} (${o.product}) en la línea ${String.fromCharCode(65+o.machine)}: ${time(o.start)}–${time(o.end)}. `;if(o.r>free)explanation+=`La máquina espera ${o.r-free} min por su disponibilidad a las ${time(o.r)}. `;if(o.start>ready)explanation+=`Desde las ${time(ready)} no cabe un proceso continuo de ${o.p} min antes de la pausa; se mueve a las ${time(o.start)}. `;if(o.start===ready&&o.r<=free)explanation+=`Empieza ${prev?'cuando termina '+prev.id:'al abrir el turno'}, sin espera adicional. `;if(state.level.show.includes('d'))explanation+=o.T?`Termina ${o.T} min tarde${state.level.show.includes('w')?'; con peso '+o.w+' aporta '+o.T*o.w+' al retraso ponderado':''}. `:'Cumple la entrega prometida. ';const contributions={'makespan':`El último pedido del plan completo termina a las ${time(g.benchmark.schedule.metrics.cmax)}.`, 'total-completion-time':`Este pedido aporta Cj = ${o.C} min a la suma de finalizaciones.`, 'weighted-completion':`Su aporte ponderado es ${o.w} × ${o.C} = ${o.w*o.C}.`, 'total-tardiness':`Aporta ${o.T} min al retraso total. Terminar antes no resta el retraso de otro pedido.`, 'weighted-tardiness':`Su retraso ponderado es ${o.w} × ${o.T} = ${o.w*o.T}.`, 'late-jobs':o.T?'Este pedido suma 1 al número de entregas tardías.':'Este pedido no suma entregas tardías.', 'load-balance':`Añade ${o.p} min de carga a esta máquina; las esperas y pausas no cuentan como trabajo.`};explanation+=contributions[state.level.objective];}

      {name:'stage_factory_queues',description:'Replace the full draft assignment and order for the open mission; does not start production.',inputSchema:{type:'object',properties:{queues:{type:'array',items:{type:'array',items:{type:'string'}}}},required:['queues'],additionalProperties:false},execute:input=>{if(!state.level||state.view!=='game'||state.running||state.guide||(state.level.formal&&!state.examReady))throw new Error('Abre una misión y detén la producción.');const schedule=E.calculateSchedule(state.level,input?.queues);resetIdle();state.queues=input.queues.map(q=>[...q]);state.selected=null;state.result=null;render();return {objective:schedule.objective,complete:schedule.complete};}}
    ];
    tools.forEach(tool=>{try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch(e){}});

  }
